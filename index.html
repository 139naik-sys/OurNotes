<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Our Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Our Notes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- shown only if config.js still has placeholders -->
<main id="setup" class="auth" hidden>
  <div class="auth-card">
    <h1>Almost there</h1>
    <p>Open <b>config.js</b> and paste in your Supabase project URL and anon key. The README has the steps.</p>
  </div>
</main>

<!-- login -->
<main id="auth" class="auth" hidden>
  <form id="loginForm" class="auth-card" autocomplete="on">
    <div class="stack"><span></span><span></span><span></span></div>
    <h1>Our Notes</h1>
    <p>Just for the two of us</p>
    <label class="field">
      <span>Email</span>
      <input id="email" type="email" autocomplete="email" required>
    </label>
    <label class="field">
      <span>Password</span>
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <div id="loginErr" class="err" role="alert"></div>
    <button id="loginBtn" class="btn-pink" type="submit">Log in</button>
  </form>
</main>

<!-- app -->
<div id="app" hidden>
  <header class="topbar">
    <div class="top">
      <div class="logo"><span class="mark"><b></b><b></b><b></b></span>Our Notes</div>
      <div class="top-actions">
        <button id="btnBell" class="ib" type="button" hidden aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <button id="btnMe" class="me" type="button" aria-label="Change your name"><span class="av" id="meAv">?</span><span id="meName"></span></button>
        <button id="btnOut" class="ib" type="button" aria-label="Log out">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </header>

  <section class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search notes" aria-label="Search notes">
    </label>
    <div class="chips" id="chips">
      <button class="chip on" type="button" data-f="all">All</button>
      <button class="chip" type="button" data-f="mine">Mine</button>
      <button class="chip" type="button" data-f="theirs" id="chipTheirs">Theirs</button>
    </div>
  </section>

  <div id="board" class="board"></div>

  <div id="empty" class="empty" hidden>
    <div class="stack small"><span></span><span></span><span></span></div>
    <p id="emptyText">No notes yet. Write the first one.</p>
  </div>

  <button id="fab" class="fab" type="button" aria-label="New note">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- note editor -->
<dialog id="editor">
  <form id="editorForm" autocomplete="off">
    <div class="ed-top">
      <input id="edTitle" class="ed-title" type="text" placeholder="Title" maxlength="120" aria-label="Title">
      <div class="seg" role="group" aria-label="Note type">
        <button type="button" data-kind="text" class="on">Text</button>
        <button type="button" data-kind="list">List</button>
      </div>
    </div>

    <textarea id="edBody" class="ed-body" rows="5" placeholder="Write something..." aria-label="Note text"></textarea>
    <div id="edList" class="ed-list" hidden></div>

    <div id="edImages" class="thumbs"></div>

    <div class="ed-bar">
      <label class="photo-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>Photo</span>
        <input id="edFile" type="file" accept="image/*" multiple hidden>
      </label>
      <div id="edColors" class="swatches" role="radiogroup" aria-label="Note colour"></div>
    </div>

    <div class="ed-actions">
      <button type="button" id="edDelete" class="txt-danger">Delete</button>
      <span class="grow"></span>
      <button type="button" id="edCancel" class="txt">Cancel</button>
      <button type="submit" id="edSave" class="btn-dark">Save</button>
    </div>
  </form>
</dialog>

<!-- name prompt -->
<dialog id="nameDialog">
  <form id="nameForm" class="card-dark">
    <h2>What should we call you?</h2>
    <p>This is the name that shows on your notes.</p>
    <input id="nameInput" type="text" maxlength="40" required autocomplete="nickname">
    <div class="row-end">
      <button type="button" id="nameCancel" class="txt-light">Cancel</button>
      <button type="submit" class="btn-pink slim">Save</button>
    </div>
  </form>
</dialog>

<!-- image viewer -->
<dialog id="lightbox"><img alt=""></dialog>

<div id="toast" popover="manual" role="status"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
